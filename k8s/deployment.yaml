apiVersion: apps/v1
kind: Deployment
metadata:
  name: devsecops-pipeline
  labels:
    app: devsecops-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devsecops-pipeline
  template:
    metadata:
      labels:
        app: devsecops-pipeline
    spec:
      containers:
      - name: app
        image: devsecops-pipeline:latest
        ports:
        - containerPort: 5000
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 3
          periodSeconds: 10
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: devsecops-pipeline-service
spec:
  type: ClusterIP
  selector:
    app: devsecops-pipeline
  ports:
  - port: 80
    targetPort: 5000
