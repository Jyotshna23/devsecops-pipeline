name: DevSecOps Pipeline
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'  # caches pip downloads between runs

    - name: Install dependencies
      run: |
        pip install -r requirements.txt

    - name: Security Scan (Bandit)
      run: |
        bandit -r app.py -f txt -ll
        # -ll = fail the build on MEDIUM or HIGH severity findings.
        # (--exit-zero was removed - it silently passed the pipeline
        # even when Bandit found real vulnerabilities.)

    - name: Run Tests
      run: |
        pytest test_app.py -v

    - name: Build Docker Image
      run: |
        docker build -t devsecops-pipeline:latest .

    - name: Scan Docker Image (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devsecops-pipeline:latest'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: '1'  # fail the build if critical/high CVEs are found in the base image

    - name: Test Docker Image
      run: |
        docker run -d -p 5000:5000 --name test-container devsecops-pipeline:latest
        sleep 3
        curl --fail http://localhost:5000/health
        curl --fail http://localhost:5000/metrics
        docker stop test-container
        docker rm test-container
