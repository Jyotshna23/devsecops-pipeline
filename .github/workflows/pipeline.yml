name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest==8.0.2 bandit==1.7.8

    - name: Security Scan (Bandit)
      run: |
        bandit -r app.py -f txt -ll

    - name: Run Unit & API Tests
      run: |
        pytest test_app.py -v

    - name: Build Docker Image
      run: |
        docker build -t devsecops-pipeline:${{ github.sha }} -t devsecops-pipeline:latest .

    - name: Scan Docker Image (Trivy)
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devsecops-pipeline:latest'
        format: 'table'
        severity: 'CRITICAL,HIGH'
        exit-code: '0'

    - name: Container Smoke Test
      run: |
        docker run -d -p 5000:5000 --name test-container devsecops-pipeline:latest
        sleep 3
        curl --fail http://localhost:5000/health
        curl --fail http://localhost:5000/metrics
        docker stop test-container
        docker rm test-container
